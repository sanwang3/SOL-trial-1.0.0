[package]
name = "sol-monitor"
version = "1.0.0"
edition = "2021"
description = "Solana blockchain real-time monitoring system"
authors = ["Developer"]

[[bin]]
name = "sol-monitor"
path = "src/main.rs"

[features]
default = []
full = []  # 正式版，无试用期限制

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
anyhow = "1"
bs58 = "0.5"
base64 = "0.22"

# Web服务器依赖
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
tokio-util = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
